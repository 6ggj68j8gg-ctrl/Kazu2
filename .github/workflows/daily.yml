name: Keirin Daily Prediction Bot

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run prediction script and send LINE
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import datetime

          # 混入した目に見えない特殊文字を自動でクリーンアップする処理
          raw_token = os.environ.get("LINE_TOKEN", "")
          LINE_TOKEN = raw_token.strip().replace("\u2060", "").replace("\u200b", "").replace(" ", "")
          
          raw_user = os.environ.get("USER_ID", "")
          USER_ID = raw_user.strip().replace("\u2060", "").replace("\u200b", "").replace(" ", "")

          def send_line(msg):
              url = "https://api.line.me/v2/bot/message/push"
              headers = {
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {LINE_TOKEN}"
              }
              data = {"to": USER_ID, "messages": [{"type": "text", "text": msg}]}
              response = requests.post(url, headers=headers, json=data, timeout=10)
              print(f"LINE API Response: {response.status_code}, {response.text}")

          today = datetime.datetime.now().strftime("%Y/%m/%d")
          text = f"【本日の2車単厳選予想】\n日付: {today}\n■ 平塚 10R\n・1 - 3 (推定11.2倍)\n・1 - 5 (推定18.5倍)\n※GitHub Actionsより毎朝自動送信"
          
          send_line(text)
          print("送信完了")
          EOF
